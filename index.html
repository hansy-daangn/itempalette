<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당근 중고거래 · 페르소나별 TOP8 매물</title>
<style>
:root{--o:#FF6F0F;--ol:#FFF3EA;--od:#D45A00;--bg:#F5F5F5;--w:#fff;--t:#1A1A1A;--s:#767676;--b:#E8E8E8;--sh:0 2px 16px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
/* HEADER */
.hd{background:var(--w);border-bottom:2.5px solid var(--o);padding:14px 20px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:38px;height:38px;background:var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo-txt{font-size:17px;font-weight:900;color:var(--o);line-height:1.1}
.logo-sub{font-size:11px;color:var(--s);margin-top:1px}
.hd-btns{display:flex;gap:8px}
.hd-btn{padding:7px 14px;border:1.5px solid var(--b);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--w);color:var(--s);transition:.15s}
.hd-btn.on{border-color:var(--o);color:var(--o);background:var(--ol)}
/* MAIN */
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px}
/* DATA BAR */
.databar{background:var(--w);border-radius:14px;padding:14px 20px;margin-bottom:22px;display:flex;align-items:flex-start;gap:0;overflow-x:auto;scrollbar-width:none;box-shadow:var(--sh)}
.db-group{flex:0 0 auto;display:flex;flex-direction:column}
.db-grp-lbl{font-size:10px;font-weight:700;color:var(--s);letter-spacing:.3px;margin-bottom:8px;white-space:nowrap;text-transform:none}
.db-grp-items{display:flex;gap:16px}
.db-div{width:1px;background:var(--b);flex:0 0 1px;margin:0 16px;align-self:stretch}
.db-item{flex:0 0 auto;text-align:center}
.db-val{font-size:18px;font-weight:900;color:var(--o)}
.db-lbl{font-size:10px;color:var(--s);margin-top:2px;white-space:nowrap}
/* SECTION LABEL */
.sec-lbl{font-size:12px;font-weight:700;color:var(--s);letter-spacing:.8px;margin-bottom:10px;text-transform:uppercase}
/* PERSONA ROW */
.p-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.p-card{flex:0 0 auto;width:176px;background:var(--w);border:2px solid var(--b);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;user-select:none}
.p-card:hover{border-color:var(--o);transform:translateY(-2px);box-shadow:var(--sh)}
.p-card.on{border-color:var(--o);background:var(--ol)}
.p-em{font-size:30px;margin-bottom:6px}
.p-nm{font-size:14px;font-weight:800;color:var(--t);margin-bottom:2px}
.p-dsc{font-size:11px;color:var(--s);line-height:1.45}
/* PERSONA INSIGHT */
.p-insight{background:var(--w);border-radius:16px;padding:18px 20px;margin-bottom:20px;border-left:4px solid var(--o);display:none;box-shadow:var(--sh)}
.p-insight.on{display:block}
.pi-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pi-em{font-size:42px}
.pi-info h2{font-size:18px;font-weight:900}
.pi-info p{font-size:12px;color:var(--s);margin-top:2px}
.pi-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pi-tag{background:var(--ol);color:var(--od);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pi-cell{background:var(--bg);border-radius:10px;padding:11px}
.pi-cl{font-size:10px;color:var(--s);margin-bottom:3px}
.pi-cv{font-size:12px;font-weight:700}
/* VERSION TABS */
.v-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.v-tab{flex:0 0 auto;padding:9px 17px;border:1.5px solid var(--b);border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;background:var(--w);color:var(--s);transition:.15s;white-space:nowrap}
.v-tab:hover{border-color:var(--o);color:var(--o)}
.v-tab.on{background:var(--o);border-color:var(--o);color:#fff}
/* VERSION INSIGHT BANNER */
.v-banner{border-radius:14px;padding:14px 18px;color:#fff;margin-bottom:18px;display:none;background:linear-gradient(135deg,var(--o),#FF9940)}
.v-banner.on{display:block}
.vb-title{font-size:15px;font-weight:900;margin-bottom:3px}
.vb-desc{font-size:12px;opacity:.92;line-height:1.55}
.vb-stats{display:flex;gap:22px;margin-top:10px}
.vb-sv{font-size:19px;font-weight:900}
.vb-sl{font-size:10px;opacity:.82;margin-top:1px}
/* ITEMS GRID */
.items-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
@media(max-width:960px){.items-grid{grid-template-columns:repeat(2,1fr)}}
/* ITEM CARD */
.ic{
  background:var(--w);
  border-radius:16px;
  border:1px solid var(--b);
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  transition:.15s;
  display:flex;
  flex-direction:column;
  position:relative
}
.ic:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.ic-body{padding:11px 11px 11px;display:flex;flex-direction:column;gap:0;position:relative}
.ic-topline{display:flex;align-items:center;justify-content:flex-start;min-height:18px;margin-bottom:8px}
.ic-rank{font-size:12px;font-weight:900;color:var(--o);line-height:1;flex:0 0 auto}
.ic-nm{font-size:22px;font-weight:900;line-height:1.14;word-break:keep-all;margin-bottom:9px}
.ic-search{display:none!important}
.ic-cat{display:none!important}
.ic-pr{display:none!important}
.ic-meta{display: grid;grid-template-columns: repeat(2, minmax(72px, 1fr));gap: 8px; margin-bottom:10px}
.ic-meta-box{background:#fafafa;border:1px solid #efefef;border-radius:8px;padding:6px}
.ic-meta-k{white-space: nowrap;font-size:10px;color:var(--s);line-height:1;margin-bottom:3px}
.ic-meta-v{white-space: nowrap;font-size:14px;line-height:1.15;color:var(--t);font-weight:500}
.ic-meta-v.price{color:var(--o);font-weight:500}
.ic-meta-v.muted{color:#8b8b8b;text-decoration:line-through}
.ic-btn-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0}
.ic-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:#666;color:#fff;font-size:12px;font-weight:800;
  padding:8px;border-radius:8px;text-decoration:none;transition:.15s;height:34px
}
.ic-btn:hover{background:#555}
/* MATRIX VIEW */
.matrix-wrap{display:none;overflow-x:auto}
.matrix-wrap.on{display:block}
table{width:100%;border-collapse:collapse;min-width:1000px;background:var(--w);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
th{background:var(--o);color:#fff;font-size:11px;font-weight:800;padding:11px 8px;text-align:center;border:1px solid rgba(255,255,255,.15)}
td{font-size:11px;color:var(--t);padding:10px 8px;border:1px solid var(--b);vertical-align:top}
tr:nth-child(even) td{background:#FAFAFA}
.mx-p{font-weight:800;font-size:12px;white-space:nowrap}
.mx-items{display:flex;flex-direction:column;gap:3px}
.mx-i{color:var(--t);font-size:10px}
.mx-i b{color:var(--o)}
/* TOP COMBOS */
.tc-sec{margin-bottom:20px}
.tc-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tc-chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--w);border:1.5px solid var(--b);border-radius:12px;cursor:pointer;transition:.15s;user-select:none}
.tc-chip:hover{border-color:var(--o);transform:translateY(-1px);box-shadow:var(--sh)}
.tc-chip.on{border-color:var(--o);background:var(--ol)}
.tc-rank{font-size:10px;font-weight:900;color:#fff;background:var(--o);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-info{display:flex;flex-direction:column}
.tc-nm{font-size:11px;font-weight:800;color:var(--t);white-space:nowrap}
.tc-sub{font-size:9.5px;color:var(--s);white-space:nowrap}
/* DATA VIEW */
.data-view{display:none}
.data-view.on{display:block}
.dv-sec{background:var(--w);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh)}
.dv-title{font-size:14px;font-weight:900;color:var(--t);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.dv-desc{font-size:11px;color:var(--s);margin-bottom:14px}
.dv-tbl{width:100%;border-collapse:collapse;font-size:11px}
.dv-tbl th{background:var(--o);color:#fff;padding:8px 10px;text-align:left;font-weight:700;border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.dv-tbl td{padding:7px 10px;border:1px solid var(--b);vertical-align:middle}
.dv-tbl tr:nth-child(even) td{background:#FAFAFA}
.dv-tbl tr:hover td{background:var(--ol)}
.dv-bar{height:6px;border-radius:3px;background:var(--o);display:inline-block;vertical-align:middle;margin-left:6px}
.dv-tag{display:inline-block;background:var(--ol);color:var(--od);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin:1px 2px}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dv-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.dv-stat-val{font-size:22px;font-weight:900;color:var(--o)}
.dv-stat-lbl{font-size:10px;color:var(--s);margin-top:2px}
.dv-stat-sub{font-size:9px;color:var(--s);margin-top:1px}
.dv-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.dv-target{font-size:11px;color:var(--s);margin-right:auto}
.dv-add-btn{border:none;background:var(--o);color:#fff;font-size:12px;font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.dv-add-btn:hover{background:var(--od)}
.mo-ta{width:100%;min-height:220px;resize:vertical;line-height:1.5}
.mo-help{font-size:11px;color:var(--s);line-height:1.55;margin:-4px 0 12px}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--s)}
.empty-em{font-size:48px;margin-bottom:14px}
/* Scrollbar hide */
::-webkit-scrollbar{display:none}
/* ── EDIT BUTTON ── */
.hd-edit{padding:7px 14px;border:1.5px solid var(--b);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--w);color:var(--s);transition:.15s;display:none!important;}
.hd-edit.on{border-color:#6C5CE7;color:#6C5CE7;background:#F0EEFF}
/* ── FAB ── */
.fab{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;align-items:center;gap:8px;background:var(--o);color:#fff;border:none;border-radius:28px;padding:14px 22px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(255,111,15,.35);transition:.2s}
.fab:hover{background:var(--od);transform:translateY(-2px)}
/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
@media(min-width:600px){.mo{align-items:center}}
.mo-box{background:var(--w);border-radius:24px 24px 0 0;padding:24px 20px 32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.mo-box{border-radius:20px}}
.mo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mo-title{font-size:17px;font-weight:900}
.mo-close{font-size:24px;cursor:pointer;color:var(--s);background:none;border:none;line-height:1;padding:0}
.mo-field{margin-bottom:13px}
.mo-lbl{font-size:11px;font-weight:700;color:var(--s);margin-bottom:5px}
.mo-inp{width:100%;padding:10px 12px;border:1.5px solid var(--b);border-radius:10px;font-size:13px;font-family:inherit;outline:none;transition:.15s;background:var(--w)}
.mo-inp:focus{border-color:var(--o)}
.mo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mo-btn{width:100%;padding:13px;background:var(--o);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;transition:.15s}
.mo-btn:hover{background:var(--od)}
/* ── AUTOCOMPLETE ── */
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--w);border:1.5px solid var(--b);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.13);z-index:700;max-height:260px;overflow-y:auto;display:none}
.ac-drop.on{display:block}
.ac-item{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--ol)}
.ac-nm{font-size:13px;font-weight:700;flex:1}
.ac-cat{font-size:10px;color:var(--s)}
.ac-vol{font-size:10px;color:var(--o);font-weight:700;white-space:nowrap}
/* ── EDIT CONTROLS ── */
.del-btn{position:absolute;top:5px;right:5px;width:22px;height:22px;background:#E8291A;color:#fff;border:none;border-radius:50%;font-size:16px;line-height:22px;text-align:center;cursor:pointer;display:none;z-index:20;padding:0;font-weight:900}
.edit-on .del-btn{display:block}
.ic-del{position:absolute;top:6px;right:6px;width:22px;height:22px;background:#E8291A;color:#fff;border:none;border-radius:50%;font-size:16px;line-height:22px;text-align:center;cursor:pointer;z-index:20;padding:0;font-weight:900}
.add-item-card{background:var(--w);border:2px dashed var(--b);border-radius:14px;min-height:110px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:6px;color:var(--s);font-size:12px;font-weight:700;transition:.15s}
.add-item-card:hover{border-color:var(--o);color:var(--o);background:var(--ol)}
.ic.dragging{opacity:.35;transform:scale(.97)}
.ic.drag-over{outline:2.5px dashed var(--o);outline-offset:2px}
.p-card[draggable="true"]{cursor:grab}
.p-card.dragging{opacity:.35;transform:scale(.97)}
.p-card.drag-over{outline:2.5px dashed var(--o);outline-offset:2px}
.mo-inp-wrap{display:flex;align-items:center;border:1.5px solid var(--b);border-radius:10px;background:var(--w);overflow:hidden}
.mo-inp-wrap:focus-within{border-color:var(--o)}
.mo-inp-wrap .mo-inp{border:none;border-radius:0;flex:1;padding-right:8px}
.mo-inp-wrap .mo-inp:focus{border:none}
.mo-suf{padding:0 12px;color:var(--s);font-size:12px;font-weight:700;white-space:nowrap;background:#fafafa;border-left:1px solid var(--b);align-self:stretch;display:flex;align-items:center}
.mo-select{appearance:none}
#preViews{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:18px}
.tc-sec{background:var(--w);border-radius:18px;padding:14px;box-shadow:var(--sh);position:sticky;top:92px}
.tc-row{display:flex;flex-direction:column;gap:10px;overflow:visible;padding-bottom:0;scrollbar-width:auto}
.tc-chip{width:100%;min-width:0;align-items:flex-start;padding:12px 12px 12px 42px;position:relative}
.tc-rank{position:absolute;left:12px;top:12px}
.tc-info{display:flex;flex-direction:column;gap:4px}
.tc-nm{line-height:1.35;white-space:normal;font-size:13px}
.tc-sub{font-size:11px}
#normalView{margin-left:240px}
.hd{background:var(--o);border-bottom:none;padding:16px 20px;justify-content:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hd-btns{display:flex;gap:12px;flex-wrap:wrap}
.hd-btn{padding:12px 18px;border:none;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;transition:.15s}
.hd-btn.on{background:#fff;color:var(--o);transform:scale(1.08)}
.hd-btn:hover{background:rgba(255,255,255,.28)}
.hd .logo,.databar,.p-insight,.v-banner{display:none !important}
.hd-btn.hd-edit,#fab,#saveBar{display:none !important}
@media(max-width:960px){#preViews{grid-template-columns:1fr}.tc-sec{position:static}#normalView{width:100%;margin-left:0}.items-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.items-grid{grid-template-columns:1fr}.hd-btn{font-size:16px;padding:11px 14px}}
/* --- 2026-04 simplified layout pass --- */

@media(max-width:1180px){

}

  syncComboHighlights();
}

async function fetchRemoteState(){
  const client = initSupabaseClient();
  if(!client) return null;
  const { data, error } = await client
    .from(SUPABASE_TABLE)
    .select('payload, updated_at')
    .eq('id', SUPABASE_ROW_ID)
    .maybeSingle();
  if(error){
    const msg = String(error.message || '');
    if(!/0 rows|JSON object requested/i.test(msg)){
      warnSupabaseSetup(msg);

    return null;
  }

  const record = { id: SUPABASE_ROW_ID, payload, updated_at: new Date().toISOString() };
  const { error } = await client
    .from(SUPABASE_TABLE)
    .upsert(record, { onConflict:'id' });
  if(error){
    warnSupabaseSetup(error.message || 'upsert failed');

// ── PARSE SEARCH VOLUME FROM META ──
function parseVol(meta){
  const m = meta.match(/검색\s*([\d.]+)([KkMm])/);
  if(!m) return 0;
  const n = parseFloat(m[1]);
  const u = m[2].toUpperCase();
  return u==='M' ? n*1000000 : n*1000;
}
function fmtVol(v){
  if(v>=1000000) return (v/1000000).toFixed(1)+'M';
  if(v>=1000) return Math.round(v/1000)+'K';
  return v+'';
}
function parsePrice(s){
  const m = s.match(/([\d.]+)만원/);
  return m ? parseFloat(m[1])*10000 : 0;
}
function calculateDiscountFromManwon(priceText, originalText){
  const used = parseFloat(String(priceText || '').replace(/[^\d.]/g,''));
  const original = parseFloat(String(originalText || '').replace(/[^\d.]/g,''));
  if(!Number.isFinite(used) || !Number.isFinite(original) || original <= 0 || used < 0) return '';
  const pct = Math.round((1 - (used / original)) * 100);
  return Math.max(0, pct).toString();
}
function updateDiscountPreview(){
  const priceEl = document.getElementById('mo-p');
  const originalEl = document.getElementById('mo-op');
  const discEl = document.getElementById('mo-disc');

  discEl.value = calculateDiscountFromManwon(priceEl.value, originalEl.value);
}
function normalizeBulkVolume(text){
  const raw = String(text||'').trim().replace(/,/g,'');
  if(!raw) return 0;
  const m = raw.match(/([\d.]+)\s*([KkMm])?$/);
  if(!m) return 0;
  const n = parseFloat(m[1]);
  if(!Number.isFinite(n)) return 0;
  const unit = (m[2]||'').toUpperCase();
  if(unit==='M') return Math.round(n*1000000);
  if(unit==='K') return Math.round(n*1000);
  return Math.round(n);
}
function parsePercentLoose(text){
  const m = String(text||'').replace(/,/g,'').match(/-?([\d.]+)/);
  return m ? m[1] : '';
}
function parseManwonLoose(text){
  const m = String(text||'').replace(/,/g,'').match(/([\d.]+)/);
  return m ? parseFloat(m[1]) : NaN;
}
function parseDiscountLoose(text){
  const m = String(text||'').replace(/,/g,'').match(/-?([\d.]+)/);
  if(!m) return NaN;
  return parseFloat(m[1]);
}
function formatManwonLoose(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return '';
  return String(Math.round(n*100)/100).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');
}
function deriveOriginalFromDiscount(usedManwon, discountPct){
  const used = Number(usedManwon);
  const discount = Number(discountPct);
  if(!Number.isFinite(used) || !Number.isFinite(discount) || used <= 0 || discount < 0 || discount >= 100) return '';
  const original = used / (1 - discount/100);
  return formatManwonLoose(original);
}
function splitBulkLine(line){
  return String(line||'').includes('	')
    ? String(line).split('	').map(s=>s.trim())
    : String(line).split(',').map(s=>s.trim());
}
// ── TOP 8 COMBO SCORING ──
function computeComboScores(){
  const scores = [];
  PERSONAS.forEach(p=>{
    VERSIONS.forEach(v=>{
      const items = (ITEMS[p.id]||{})[v.id]||[];
      let totalVol = 0, totalDisc = 0, totalPrice = 0;
      items.forEach(it=>{
        totalVol += parseVol(it.meta);
        totalDisc += parseInt(it.disc)||0;
        totalPrice += parsePrice(it.p);
      });
      const avgDisc = items.length ? Math.round(totalDisc/items.length) : 0;
      scores.push({
        pid:p.id, vid:v.id,
        pName:p.name, pEm:p.em,
        vLabel:v.label.replace(/^.\s*/,''),
        totalVol, avgDisc,
        count:items.length
      });
    });
  });
  scores.sort((a,b)=>b.totalVol - a.totalVol);
  return scores.slice(0,8);
}

// PERSISTENCE & EDIT MODE
// ═══════════════════════════════════════════════════════════════════════════
let isDirty = false;
let editMode = false;
async function loadFromStorage(){
  try{
    const localPayload = loadLocalBackup();
    const remote = await fetchRemoteState();
    if(remote && remote.payload){
      const localSavedAt = parseIsoTime(localPayload && localPayload.saved_at);
      const remoteSavedAt = parseIsoTime(remote.updated_at);
      if(!localPayload || remoteSavedAt >= localSavedAt){
        applyPersistedState(remote.payload);
        saveLocalBackup(remote.payload);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(remote.payload));
        persistenceMode = 'supabase';
        return;
      }
    }
    if(localPayload){
      applyPersistedState(localPayload);
      persistenceMode = remote ? 'local-newer' : 'local';
    }
    ensureDataShape();
  }catch(e){ console.error('load failed',e); }
}
async function saveAll(){
  ensureDataShape();
  const payload = getSerializableState();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  saveLocalBackup(payload);
  const remoteResult = await pushRemoteState(payload);
  isDirty=false;
  updateFab();
  showSaveStatus(remoteResult.ok ? 'Supabase에 저장됐어요.' : 'Supabase 연결 전이라 브라우저에만 저장됐어요.', !remoteResult.ok);
  return remoteResult.ok;
}
function markDirty(){ isDirty=true; updateFab(); }
function updateFab(){
  const el=document.getElementById('fabMain');
  if(!el) return;
  // Determine label and background color based on mode and dirty flag
  if(!editMode){
    // Not in edit mode: show edit button
    el.innerHTML='✏️ 편집하기';
    el.style.background = '#FFD463';
    el.style.display = 'flex';
  }else if(isDirty){
    // Editing with unsaved changes: show save button
    el.innerHTML='💾 저장하기';
    el.style.background = 'var(--o)';
    el.style.display = 'flex';
  }else{
    // Editing with no changes: indicate edit mode
    el.innerHTML='✏️ 편집 중';
    el.style.background = '#FFD463';
    el.style.display = 'flex';
  }
}
window.addEventListener('beforeunload', e=>{
  if(isDirty){ e.preventDefault(); e.returnValue=''; }
});
function setEditMode(next){
  editMode = !!next;
  const btn = document.getElementById('btn-edit');
  if(btn){
    btn.classList.toggle('on', editMode);
    btn.textContent = editMode ? '✏️ 편집 중' : '✏️ 편집';
  }
  if(editMode){
    if(!curPersona && PERSONAS[0]) curPersona = PERSONAS[0].id;
    if(!curVersion && VERSIONS[0]) curVersion = VERSIONS[0].id;
  }
  document.body.classList.toggle('edit-on', editMode);
  renderPersonaRow();
  renderVersionRow();
  renderItems();
  refreshDerivedViews();
}
function toggleEditMode(){
  setEditMode(!editMode);
}
// Handle clicks on the floating action button. When not editing, enable edit mode.
// When editing and there are unsaved changes, save all data. When editing with no changes, exit edit mode.
async function onFabClick(){
  if(!editMode){
    setEditMode(true);
    updateFab();
    return;
  }
  if(isDirty){
    await saveAll();
    setEditMode(false);
    updateFab();
    return;
  }
  setEditMode(false);
  updateFab();
}

function deletePersona(pid){
  if(!confirm('이 페르소나를 삭제하시겠습니까?')) return;
  const idx=PERSONAS.findIndex(p=>p.id===pid);
  if(idx>=0) PERSONAS.splice(idx,1);
  delete ITEMS[pid];
  for(let i=CUSTOM_COMBOS.length-1;i>=0;i--){ if(CUSTOM_COMBOS[i].pid===pid) CUSTOM_COMBOS.splice(i,1); }
  if(curPersona===pid){ curPersona=null; document.getElementById('pInsight').className='p-insight'; }
  markDirty(); renderPersonaRow(); renderItems(); refreshDerivedViews();
}
function deleteVersion(vid){
  if(!confirm('이 버전을 삭제하시겠습니까?')) return;
  const idx=VERSIONS.findIndex(v=>v.id===vid);
  if(idx>=0) VERSIONS.splice(idx,1);
  Object.keys(ITEMS).forEach(pid=>{ if(ITEMS[pid]) delete ITEMS[pid][vid]; });
  for(let i=CUSTOM_COMBOS.length-1;i>=0;i--){ if(CUSTOM_COMBOS[i].vid===vid) CUSTOM_COMBOS.splice(i,1); }
  if(curVersion===vid){ curVersion=null; }
  markDirty(); renderVersionRow(); renderItems(); refreshDerivedViews();
}
function deleteItem(pid, vid, idx){
  if(!ITEMS[pid]||!ITEMS[pid][vid]) return;
  ITEMS[pid][vid].splice(idx,1);
  markDirty(); renderItems(); refreshDerivedViews();
}

let dragSrcIdx=null;
function setupItemDrag(grid, pid, vid){
  const cards=Array.from(grid.querySelectorAll('.ic[draggable="true"]'));
  cards.forEach((card,idx)=>{
    card.addEventListener('dragstart', e=>{
      dragSrcIdx=idx; e.dataTransfer.effectAllowed='move';
      setTimeout(()=>card.classList.add('dragging'),0);
    });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
    card.addEventListener('dragover', e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      if(dragSrcIdx===null||dragSrcIdx===idx) return;
      const arr=ITEMS[pid][vid];
      const [moved]=arr.splice(dragSrcIdx,1);
      arr.splice(idx,0,moved);
      dragSrcIdx=null;
      markDirty(); renderItems(); refreshDerivedViews();
    });
  });
}
let dragPersonaIdx=null;
function setupPersonaDrag(row){
  const cards = Array.from(row.querySelectorAll('.p-card[draggable="true"]'));
  cards.forEach((card, idx)=>{
    card.addEventListener('dragstart', e=>{
      dragPersonaIdx = idx;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>card.classList.add('dragging'),0);
    });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
    card.addEventListener('dragover', e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      if(dragPersonaIdx===null || dragPersonaIdx===idx) return;
      const [moved] = PERSONAS.splice(dragPersonaIdx,1);
      PERSONAS.splice(idx,0,moved);
      dragPersonaIdx = null;
      markDirty();
      renderPersonaRow();
      refreshDerivedViews();
    });
  });
}

let acCache=null;
function getAcData(){
  if(acCache) return acCache;
  const map={};
  Object.values(ITEMS).forEach(pvObj=>{
    if(!pvObj) return;
    Object.values(pvObj).forEach(arr=>{
      if(!Array.isArray(arr)) return;
      arr.forEach(it=>{
        if(!it||!it.nm) return;
        if(!map[it.nm]) map[it.nm]={...it, vol:parseVol(it.meta||'')};
      });
    });
  });
  acCache=Object.values(map).sort((a,b)=>b.vol-a.vol);
  return acCache;
}
function showAcDrop(input, drop){
  const q=input.value.trim();
  const list=getAcData();
  const filtered=q
    ? list.filter(i=>(i.nm&&i.nm.includes(q))||(i.cat&&i.cat.includes(q)))
    : list.slice(0,20);
  if(!filtered.length){ drop.classList.remove('on'); return; }
  drop.innerHTML=filtered.slice(0,20).map(it=>{
    const e=s=>(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
    return `<div class="ac-item" onmousedown="selectAcItem(event,'${e(it.nm)}','${e(it.cat||'')}','${e(it.p||'')}','${e(it.op||'')}','${e(it.disc||'')}','${e(it.meta||'')}','${e(it.hook||'')}')">
      <div class="ac-nm">${it.nm}</div>
      <div class="ac-cat">${it.cat||''}</div>
      <div class="ac-vol">${fmtVol(it.vol)}</div>
    </div>`;
  }).join('');
  drop.classList.add('on');
}
function selectAcItem(e,nm,cat,p,op,disc,meta,hook){
  e.preventDefault();
  const s=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
  s('mo-nm',nm); s('mo-cat',cat); s('mo-p',parseManwonNumber(p)); s('mo-op',parseManwonNumber(op));
  s('mo-search-vol', parseVol(meta||'') || '');
  updateDiscountPreview();
  const drop=document.querySelector('.ac-drop');
  if(drop) drop.classList.remove('on');
}

function confirmBulkAddItems(){
  const pid = (document.getElementById('mo-bulk-pid')||{}).value || '';
  const vid = (document.getElementById('mo-bulk-vid')||{}).value || '';
  const raw = (document.getElementById('mo-bulk-text')||{}).value || '';
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ alert('추가할 매물 데이터를 입력해주세요.'); return; }
  const useUnassigned = !(pid && vid);
  const targetPid = useUnassigned ? '__unassigned__' : pid;
  const targetVid = useUnassigned ? '__pool__' : vid;
  if(!ITEMS[targetPid]) ITEMS[targetPid] = {};
  if(!ITEMS[targetPid][targetVid]) ITEMS[targetPid][targetVid] = [];
  const added = [];
  const failed = [];
  lines.forEach((line, index)=>{
    const parts = splitBulkLine(line).map(s=>s.trim());
    if(parts.length < 5){
      failed.push((index+1)+'행: 항목 수 부족');
      return;
    }
    const [nmRaw, catRaw, volRaw, priceRaw, discRaw] = parts;
    const nm = String(nmRaw||'').trim();
    if(!nm){
      failed.push((index+1)+'행: 매물이름 없음');
      return;
    }
    const cat = CATEGORY_OPTIONS.find(c=>c===catRaw) || catRaw || '기타';
    const usedManwon = parseManwonLoose(priceRaw);
    if(!Number.isFinite(usedManwon) || usedManwon <= 0){
      failed.push((index+1)+'행: 중고가 형식 오류');
      return;
    }
    const discountPct = parseDiscountLoose(discRaw);
    const originalManwon = deriveOriginalFromDiscount(usedManwon, discountPct);
    const searchVol = normalizeBulkVolume(volRaw);
    ITEMS[targetPid][targetVid].push({
      nm,
      cat,
      p: formatManwonLoose(usedManwon) + '만원',
      op: originalManwon ? originalManwon + '만원' : '',
      disc: originalManwon ? calculateDiscountFromManwon(formatManwonLoose(usedManwon), originalManwon) : (Number.isFinite(discountPct) ? String(Math.round(discountPct)) : ''),
      meta: buildMeta(searchVol),
      hook: ''
    });
    added.push(nm);
  });
  acCache = null;
  if(added.length){
    closeModal();
    markDirty();
    if(!useUnassigned){
      curPersona = pid;
      curVersion = vid;
    }
    renderPersonaRow();
    renderVersionRow();
    renderItems();
    refreshDerivedViews();
    let msg = added.length + '개 매물을 추가했어요.';
    if(useUnassigned) msg += ' (선택하지 않음으로 저장)';
    if(failed.length) msg += ' (' + failed.length + '개 행은 제외)';
    showSaveStatus(msg, failed.length > 0);
    if(failed.length) alert(msg + '\n\n제외된 행:\n' + failed.slice(0,10).join('\n'));
    return;
  }
  alert('추가된 매물이 없어요.\n' + failed.join('\n'));
}

function confirmAddPersona(){
  const name=(document.getElementById('mo-pname').value||'').trim();
  if(!name){ alert('이름을 입력해주세요'); return; }
  const age=(document.getElementById('mo-age').value||'').trim();
  if(!age){ alert('나이대를 입력해주세요'); return; }
  // parse categories input: allow comma-separated or whitespace-separated values
  const catsInput=(document.getElementById('mo-cats').value||'').trim();
  const catsList=catsInput?catsInput.split(/[,\s]+/).map(s=>s.trim()).filter(s=>s):[];
  const id='p'+Date.now();

  let shortDesc=age+'세';
  if(catsList.length>0){
    shortDesc+=' · '+catsList.join('/');
  }
  PERSONAS.push({
    id,
    em:document.getElementById('mo-em').value.trim()||'👤',
    name,
    short:shortDesc,
    desc:document.getElementById('mo-pdesc').value.trim(),
    tags:catsList.length>0?catsList:[name],
    profile:age+'세',
    trigger:'-',
    topQuery:'-',
    adResp:'-',
    category:catsList.length>0?catsList.join(' · '):'-',
    spend:'-'
  });
  if(!ITEMS[id]) ITEMS[id]={};
  VERSIONS.forEach(v=>{ if(!ITEMS[id][v.id]) ITEMS[id][v.id]=[]; });
  closeModal(); markDirty(); renderPersonaRow(); refreshDerivedViews();
